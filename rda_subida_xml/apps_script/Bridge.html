<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="estado">cargando</div><pre id="resultado" hidden></pre><div id="error"></div>
<script>google.script.run.withSuccessHandler(d => {
 document.getElementById('resultado').textContent=JSON.stringify(d);
 document.getElementById('estado').textContent='listo';
}).withFailureHandler(e => {
 document.getElementById('error').textContent=e.message||String(e);
 document.getElementById('estado').textContent='error';
}).listarRegistros();</script></body></html>
